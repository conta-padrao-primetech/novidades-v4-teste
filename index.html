<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<title>Novidades na tecnologia</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
:root { --bg: #F2F3F6; --fg: #16171C; --graphite: #23262F; color-scheme: light; box-sizing: border-box; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid rgba(255, 255, 255, .9); outline-offset: 2px; border-radius: 8px; }
.palco { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
.historia { position: relative; width: min(1140px, 100%); height: min(560px, calc(100dvh - 48px)); border-radius: 24px; overflow: hidden; background: var(--graphite); color: #fff; isolation: isolate; box-shadow: 0 30px 80px rgba(20, 22, 40, .28); user-select: none; -webkit-user-select: none; }
.msg { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; padding: 24px; text-align: center; z-index: 6; }
.msg[hidden] { display: none; }

/* ---------- barras de progresso e topo (jeito de stories) ---------- */
.barras { position: absolute; top: 0; left: 0; right: 0; z-index: 6; display: flex; gap: 6px; padding: calc(14px + env(safe-area-inset-top, 0px)) 24px 0; }
.seg { flex: 1; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .32); position: relative; overflow: hidden; }
.seg.feito::after, .seg.atual::after { content: ""; position: absolute; inset: 0; background: #fff; transform-origin: left; }
.seg.atual::after { animation: enche var(--dur, 8s) linear forwards; }
.historia.parado .seg.atual::after, .historia.sem-auto .seg.atual::after { animation: none; transform: scaleX(.12); }
@keyframes enche { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.topo { position: absolute; top: calc(30px + env(safe-area-inset-top, 0px)); left: 0; right: 0; z-index: 6; display: flex; align-items: center; gap: 14px; padding: 0 24px; pointer-events: none; }
.marca { font: 700 17px/1 "Space Grotesk", system-ui, sans-serif; letter-spacing: -.01em; white-space: nowrap; }
.marca span { font-weight: 700; opacity: .72; }
.topo .sep { width: 1px; height: 22px; background: rgba(255, 255, 255, .45); }
.topo .quem { display: grid; gap: 1px; min-width: 0; }
.topo .quem b { font: 600 13.5px/1.2 "IBM Plex Sans", sans-serif; }
.topo .quem span { font-size: 12.5px; opacity: .88; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pausa { margin-left: auto; pointer-events: auto; width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .5); background: rgba(0, 0, 0, .2); display: grid; place-items: center; }
.pausa svg { width: 16px; height: 16px; }

/* ---------- slides: grade de terços (3 faixas iguais) ---------- */
.slides { position: absolute; inset: 0; touch-action: none; }
.slide { position: absolute; inset: 0; display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: repeat(3, minmax(0, 1fr)); grid-template-areas: ". arte" "bloco arte" "resumo arte"; column-gap: 20px; padding: 0 84px; opacity: 0; visibility: hidden; transition: opacity .45s ease, visibility .45s; background: linear-gradient(135deg, var(--a, #2A2D38), var(--a2, #08090C)); overflow: hidden; }
.slide.on { opacity: 1; visibility: visible; z-index: 1; }
.bloco { grid-area: bloco; align-self: end; position: relative; z-index: 2; padding-bottom: 44px; }   /* tags + título juntos, logo acima do botão */
.ctx { padding-bottom: 14px; }
.resumo { grid-area: resumo; align-self: start; position: relative; z-index: 2; padding-top: 40px; }
.acao { grid-area: resumo; align-self: start; justify-self: start; position: relative; z-index: 3; transform: translateY(-50%); }   /* o centro do botão fica em cima da linha de 2/3 */
.acao:empty { display: none; }
.arte, .hero { align-self: center; position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; min-height: 0; }
.arte { grid-area: arte; }
.hero { grid-area: hero; }
/* abertura: tudo num grupo só, centralizado, com espaços regulares */
.abertura { grid-template-rows: auto auto; grid-template-areas: "bloco hero" "resumo hero"; align-content: center; row-gap: 30px; padding-top: 96px; padding-bottom: 24px; }   /* o grupo centraliza só na área abaixo do cabeçalho */
.abertura .bloco { padding-bottom: 0; }
.abertura .resumo { padding-top: 0; }
.arte svg { width: min(100%, 320px); height: auto; overflow: visible; }
.pilulas { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; }
.pil { background: rgba(255, 255, 255, .18); border: 1px solid rgba(255, 255, 255, .32); border-radius: 99px; padding: 4px 12px; font: 600 12.5px/1.2 "IBM Plex Sans", sans-serif; letter-spacing: .02em; }
.pil.claro { background: #fff; color: #111; border-color: #fff; }
.pil.sis { background: rgba(0, 0, 0, .3); border-color: rgba(255, 255, 255, .5); font-weight: 800; letter-spacing: .07em; text-transform: uppercase; }
.slide h1, .slide h2 { margin: 0; font: 700 clamp(26px, 3.6vw, 42px)/1.08 "Space Grotesk", system-ui, sans-serif; letter-spacing: -.015em; max-width: 26ch; text-wrap: balance; }
.slide p { text-wrap: balance; margin: 0; font-size: clamp(16px, 1.6vw, 19px); line-height: 1.45; max-width: 46ch; opacity: .94; }
.slide p strong { font-weight: 600; }
.btn-claro { background: #fff; color: #14151A; border: 0; border-radius: 99px; padding: 10px 18px; min-height: 44px; font-weight: 600; font-size: 14.5px; position: relative; z-index: 3; }
.btn-claro:hover { box-shadow: 0 8px 22px rgba(0, 0, 0, .28); }
.grande { font: 700 clamp(120px, 22vw, 250px)/.85 "Space Grotesk", sans-serif; letter-spacing: -.05em; color: transparent; -webkit-text-stroke: 3px rgba(255, 255, 255, .85); text-align: center; white-space: nowrap; }
.grande.g3 { font-size: clamp(90px, 14vw, 170px); }
.cap { text-align: center; margin-top: 22px; font: 600 clamp(13px, 1.5vw, 17px)/1.2 "IBM Plex Sans", sans-serif; letter-spacing: .22em; text-transform: uppercase; color: rgba(255, 255, 255, .85); }
.nums { display: flex; gap: 0; flex-wrap: wrap; align-items: stretch; margin: 0 0 14px; }
.nums .grupo { display: flex; gap: 18px; }
.nums div div { min-width: 70px; }
.nums b { display: block; font: 700 38px/1 "Space Grotesk", sans-serif; }
.nums span { font-size: 13px; opacity: .85; }
.bloco .lead { margin-top: 12px; }
.slide p.dica { font-size: 15px; opacity: .8; }
@keyframes flutua { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
@keyframes gira { to { transform: rotate(360deg); } }
.arte .f1 { animation: flutua 5.5s ease-in-out infinite; }
.arte .f2 { animation: flutua 7s ease-in-out infinite reverse; }
.arte .rot { transform-origin: 160px 160px; animation: gira 60s linear infinite; }

/* ---------- setas (computador) ---------- */
.seta { position: absolute; top: 50%; z-index: 7; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .55); background: rgba(0, 0, 0, .24); backdrop-filter: blur(4px); display: grid; place-items: center; }
.seta svg { width: 20px; height: 20px; }
.seta:hover { background: rgba(255, 255, 255, .24); }
.seta.ant { left: 14px; }
.seta.prox { right: 14px; }

/* ---------- detalhes (folha) ---------- */
.fundo { position: fixed; inset: 0; background: rgba(10, 12, 20, .55); z-index: 40; }
.fundo[hidden], .folha[hidden], .previa[hidden] { display: none; }
.folha { position: fixed; z-index: 41; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(540px, calc(100% - 32px)); max-height: calc(100dvh - 48px); overflow: auto; background: #fff; color: var(--fg); border-radius: 22px; padding: 30px 26px 26px; box-shadow: 0 30px 80px rgba(0, 0, 0, .4); }
.folha-faixa { position: absolute; left: 0; right: 0; top: 0; height: 8px; background: var(--a, #23262F); }
.fechar { position: absolute; top: 14px; right: 14px; width: 38px; height: 38px; border-radius: 50%; border: 1px solid #D9DBE2; background: #fff; display: grid; place-items: center; }
.fechar svg { width: 16px; height: 16px; }
.folha :focus-visible { outline: 3px solid var(--a, #23262F); }
.folha .pil { background: #ECEDF1; border-color: #ECEDF1; color: #16171C; }
.folha .pil.claro { background: var(--a, #23262F); border-color: var(--a, #23262F); color: #fff; }
.folha .pil.sis { background: #fff; border: 2px solid #16171C; color: #16171C; }
.folha h3 { margin: 4px 36px 10px 0; font: 700 25px/1.15 "Space Grotesk", sans-serif; letter-spacing: -.01em; }
.folha-detalhe { margin: 0 0 18px; color: #3A3D46; font-size: 16.5px; line-height: 1.55; }
.dados { margin: 0; display: grid; gap: 8px; border-top: 1px solid #E2E3E8; padding-top: 14px; }
.dados div { display: flex; gap: 12px; }
.dados dt { width: 74px; flex: none; color: #5C5F68; font-size: 13.5px; }
.dados dd { margin: 0; font-weight: 600; font-size: 14.5px; }
.previa { position: fixed; z-index: 30; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; align-items: center; background: #fff; border: 1px solid #D9DBE2; border-radius: 99px; padding: 5px 6px 5px 12px; font-size: 12.5px; box-shadow: 0 6px 20px rgba(0, 0, 0, .12); }
.previa button { border: 1px solid #D9DBE2; background: #fff; border-radius: 99px; padding: 5px 12px; font-size: 12.5px; font-weight: 500; }
.previa button[aria-pressed="true"] { background: #16171C; color: #fff; border-color: #16171C; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: #fff; padding: 10px 18px; border-radius: 99px; font-size: 14px; z-index: 60; opacity: 0; pointer-events: none; transition: opacity .25s; }
.toast.on { opacity: 1; }

/* ---------- celular: a tela toda, na mesma grade de terços ---------- */
@media (max-width: 899px) {
  .palco { display: block; padding: 0; }
  .historia { width: 100%; height: 100dvh; border-radius: 0; box-shadow: none; }
  .slide, .abertura { grid-template-columns: 1fr; grid-template-rows: minmax(0, min(42dvh, calc(100dvh - 380px))) minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "arte" "bloco" "resumo"; align-content: normal; row-gap: 0; column-gap: 0; padding: 0 22px; }
  .abertura { grid-template-rows: minmax(0, min(42dvh, calc(100dvh - 400px))) auto 1fr; grid-template-areas: "hero" "bloco" "resumo"; }
  .abertura .bloco { align-self: start; padding: 14px 0 28px; }   /* o grupo começa na linha de 1/3, compacto */
  .bloco, .abertura .bloco { align-self: center; padding-bottom: 26px; }
  .ctx { padding: 0 0 14px; }
  .slide h1, .slide h2 { font-size: clamp(26px, 7.8vw, 32px); max-width: none; }
  .arte, .hero { align-self: stretch; padding: calc(92px + env(safe-area-inset-top, 0px)) 0 8px; align-items: center; }
  .arte svg { width: auto; height: 100%; max-height: min(260px, 30dvh); aspect-ratio: 1; }
  .resumo { padding-top: 38px; }
  .abertura .resumo { padding-top: 0; }
  .grande { font-size: clamp(84px, min(42vw, 19dvh), 170px); text-align: center; }
  .grande.g3 { font-size: clamp(60px, min(28vw, 13dvh), 112px); }
  .cap { margin-top: 8px; font-size: 14px; text-align: center; }
  .previa { top: auto; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); flex-wrap: nowrap; overflow-x: auto; border-radius: 99px; padding: 4px 8px; max-width: calc(100% - 16px); }
  .previa .rt { display: none; }
  .previa button { padding: 4px 9px; font-size: 11.5px; }
  .abertura { padding-top: 0; padding-bottom: 0; }
  .seta { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
  .barras, .topo { padding-left: 18px; padding-right: 18px; }
  .folha { top: auto; bottom: 0; left: 0; transform: none; width: 100%; max-height: 82dvh; border-radius: 22px 22px 0 0; padding-bottom: calc(26px + env(safe-area-inset-bottom, 0px)); animation: sobe .25s ease-out; }
}
@keyframes sobe { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
@media (min-width: 900px) and (max-height: 640px) { .slide { padding-top: 96px; padding-bottom: 40px; } }
@media (prefers-reduced-motion: reduce) { .arte .f1, .arte .f2, .arte .rot { animation: none; } .slide { transition: none; } .folha { animation: none; } }

.previa button { white-space: nowrap; }
.previa { flex-wrap: wrap; justify-content: center; border-radius: 18px; max-width: calc(100% - 20px); row-gap: 6px; padding: 6px 10px; }

@media (max-width: 899px) { .previa { flex-wrap: nowrap; width: max-content; border-radius: 99px; padding: 4px 8px; } }
.previa { width: max-content; }


/* ---------- V4: área em destaque, foto da equipe, seção de Features ---------- */
.pil.area { font-size: clamp(14px, 1.5vw, 18px); font-weight: 700; padding: 7px 16px; letter-spacing: .01em; display: inline-flex; gap: 8px; align-items: center; }
.pil.area::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--a, #23262F); flex: none; }
.folha .pil.area::before { background: #fff; }
.foto { gap: 14px; }
.moldura { position: relative; height: min(400px, calc(100dvh - 250px)); aspect-ratio: 4 / 5; max-width: 100%; border-radius: 30px; background: rgba(255, 255, 255, .16); border: 2px solid rgba(255, 255, 255, .6); display: grid; place-items: center; box-shadow: 0 22px 48px rgba(0, 0, 0, .3); }
.moldura .ph { border-radius: 28px; overflow: hidden; }
.emote { position: absolute; right: -18px; bottom: -18px; width: 92px; height: 92px; border-radius: 28px; background: rgba(255, 255, 255, .22); border: 2px solid rgba(255, 255, 255, .6); backdrop-filter: blur(4px); display: grid; place-items: center; box-shadow: 0 12px 28px rgba(0, 0, 0, .25); animation: flutua 5.5s ease-in-out infinite; }
.emote svg { width: 60px; height: 60px; }
.arte svg.fundo-arte { position: absolute; left: 50%; top: 50%; width: 400px; height: 400px; max-width: none; transform: translate(-50%, -50%); z-index: 0; pointer-events: none; }
.arte.foto .moldura { z-index: 1; }
.arte.foto .legenda { z-index: 1; position: relative; }
.moldura .ph { position: absolute; inset: 0; opacity: .9; display: grid; place-items: center; }
.moldura .ph svg { width: 56%; height: auto; overflow: visible; }
.moldura .ini { font: 700 clamp(40px, 6vw, 64px)/1 "Space Grotesk", sans-serif; opacity: .95; }
.moldura img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 8%; border-radius: 28px; }
.legenda { text-align: center; max-width: 100%; }
.legenda span { display: block; font: 600 12px/1.2 "IBM Plex Sans", sans-serif; letter-spacing: .22em; text-transform: uppercase; opacity: .85; margin-bottom: 4px; }
.legenda b { display: block; font: 700 clamp(18px, 2vw, 24px)/1.15 "Space Grotesk", sans-serif; }
.slide h2.cita { font-size: clamp(20px, 2.5vw, 30px); line-height: 1.22; max-width: 36ch; font-weight: 600; }
.slide .quem-dep { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-bottom: 10px; }
.slide .quem-dep b { font: 700 20px/1.2 "Space Grotesk", sans-serif; }
.slide .quem-dep span { font-size: 15px; opacity: .9; }
.vrot { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font: 600 12.5px/1.2 "IBM Plex Sans", sans-serif; letter-spacing: .16em; text-transform: uppercase; opacity: .9; margin-bottom: 10px; }
.vrot .ex { letter-spacing: .06em; text-transform: none; border: 1px solid rgba(255, 255, 255, .5); border-radius: 99px; padding: 2px 9px; font-size: 11.5px; }
.vquote { display: flex; flex-direction: column; gap: 0; align-items: flex-start; }
.vquote p, .vpo p { margin: 0; }
.vquote q { quotes: none; display: block; font: 600 clamp(16px, 1.5vw, 19px)/1.3 "Space Grotesk", sans-serif; margin-bottom: 6px; }
.vquote cite { font-style: normal; font-size: 14.5px; opacity: .92; }
.vpo p { font: 500 clamp(16px, 1.5vw, 19px)/1.4 "IBM Plex Sans", sans-serif; }
.slide.feat { grid-template-columns: minmax(0, 5fr) minmax(0, 3fr); grid-template-rows: minmax(0, 1fr); grid-template-areas: "txt painel"; column-gap: 56px; align-items: stretch; padding: 104px 84px 44px; }
.feat .txt { grid-area: txt; position: relative; z-index: 2; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; min-width: 0; min-height: 0; }
.feat .t-topo { display: flex; flex-direction: column; align-items: flex-start; }
.feat .t-topo .pilulas { margin: 0 0 16px; gap: 8px; align-items: center; }
.feat .t-topo .pil, .feat .t-topo .pil.area { height: 28px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 7px; padding: 0 13px; font: 700 clamp(12px, 1.1vw, 13.5px)/1 "IBM Plex Sans", sans-serif; letter-spacing: .01em; }
.feat .t-topo .pil.area::before { width: 8px; height: 8px; }
.feat .t-topo h2 { font-size: clamp(28px, 3.7vw, 42px); line-height: 1.1; max-width: 20ch; margin: 0 0 18px; }
.feat .t-topo p.chamada { font-size: clamp(17px, 1.7vw, 20px); line-height: 1.45; max-width: 40ch; margin: 0; }
.feat .t-base { display: flex; flex-direction: column; align-items: flex-start; margin-top: clamp(22px, 4.5vh, 36px); }
.feat .t-base p.pub { margin: 14px 0 0; font: 500 12.5px/1.2 "IBM Plex Sans", sans-serif; letter-spacing: .02em; opacity: .7; }
.feat .painel { grid-area: painel; position: relative; z-index: 2; display: flex; flex-direction: column; gap: 14px; min-width: 0; min-height: 0; padding: 18px; border-radius: 28px; background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .32); box-shadow: 0 18px 40px rgba(0, 0, 0, .22); }
.feat .painel .arte { flex: 1 1 0; min-height: 0; width: 100%; padding: 0; gap: 12px; align-self: stretch; justify-content: center; pointer-events: none; }
.feat .painel .arte svg.fundo-arte { display: none; }
.feat .painel .moldura { flex: 1 1 0; min-height: 0; width: 100%; height: auto; max-width: none; aspect-ratio: auto; border-radius: 20px; border: 0; box-shadow: none; }
.feat .painel .moldura .ph, .feat .painel .moldura img { border-radius: 20px; }
.feat .painel .emote { width: 68px; height: 68px; border-radius: 21px; right: 12px; bottom: -14px; }
.feat .painel .emote svg { width: 42px; height: 42px; }
.feat .painel .arte.emo { align-items: center; justify-content: center; gap: 14px; text-align: center; }
.feat .painel .arte.emo .emote { position: relative; right: auto; bottom: auto; width: 104px; height: 104px; border-radius: 30px; flex: none; }
.feat .painel .arte.emo .emote svg { width: 64px; height: 64px; }
.feat .painel .arte.emo .legenda b { font-size: clamp(19px, 1.9vw, 23px); text-wrap: balance; }
.feat.cv .painel { padding: 28px 30px; overflow: visible; display: grid; grid-template-columns: 76px 1fr; grid-template-rows: auto auto 1fr; column-gap: 20px; row-gap: 0; align-items: start; align-self: center; }
.feat.cv .painel .arte { position: relative; inset: auto; grid-column: 1; grid-row: 1 / span 2; width: 76px; height: 76px; flex: none; padding: 0; margin: 0; gap: 0; }
.feat.cv .painel .moldura { position: relative; inset: auto; width: 76px; height: 76px; flex: none; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .55); }
.feat.cv .painel .moldura .ph, .feat.cv .painel .moldura img { border-radius: 50%; }
.feat.cv .painel .emote { display: none; }
.feat.cv .painel .valor, .feat.cv .painel .vquote { display: contents; }
.feat.cv .painel .vrot { grid-column: 2; grid-row: 1; align-self: end; margin: 0 0 3px; }
.feat.cv .painel .vquote cite { grid-column: 2; grid-row: 2; align-self: start; margin: 0; font-size: 16px; line-height: 1.25; }
.feat.cv .painel .vquote q { grid-column: 1 / -1; grid-row: 3; align-self: center; margin: 14px 0 0; }
.feat.dep.sf .painel { align-self: center; padding: 28px 30px; overflow: visible; display: grid; grid-template-columns: 76px 1fr; grid-template-rows: auto auto 1fr; column-gap: 20px; row-gap: 0; align-items: start; }
.feat.dep.sf .painel .arte.emo { grid-column: 1; grid-row: 1 / span 2; width: 76px; height: 76px; flex: none; padding: 0; margin: 0; gap: 0; display: block; }
.feat.dep.sf .painel .arte.emo .emote { position: relative; right: auto; bottom: auto; width: 76px; height: 76px; border-radius: 24px; }
.feat.dep.sf .painel .arte.emo .emote svg { width: 48px; height: 48px; }
.feat.dep.sf .painel .arte.emo .legenda { display: none; }

      el("div", { class: "quem" }, el("b", { text: NOME }), el("span", { text: periodoTxt(ed) ? "Período de " + periodoTxt(ed) : "" })), pausa);
    $("#historia").classList.toggle("sem-auto", semAuto());
    $("#msg").hidden = true;
    state.idx = 0;
    mostrar();
  }
  var ICO_PAUSA = '<svg viewBox="0 0 24 24" fill="#fff"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
  var ICO_PLAY = '<svg viewBox="0 0 24 24" fill="#fff"><path d="M8 5l11 7-11 7z"/></svg>';
  function mostrar() {
    state.slides.forEach(function (s, i) {
      var on = i === state.idx;
      if (on && window.matchMedia && window.matchMedia("(max-width: 899px)").matches) {
        var c2 = s.style.getPropertyValue("--a2") || "";
        if (c2) {
          document.documentElement.style.backgroundColor = c2;
          var tc = document.querySelector('meta[name="theme-color"]');
          if (!tc) { tc = document.createElement("meta"); tc.name = "theme-color"; document.head.appendChild(tc); }
          tc.content = c2;
        }
      }
    });
    state.slides.forEach(function (s, i) {
      var on = i === state.idx;
      s.classList.toggle("on", on);
      s.setAttribute("aria-hidden", on ? "false" : "true");
      s.querySelectorAll("button").forEach(function (b) { b.tabIndex = on ? 0 : -1; });
    });
    state.segs.forEach(function (g, i) {
      g.classList.remove("feito", "atual");
      if (i < state.idx) g.classList.add("feito");
      if (i === state.idx) { void g.offsetWidth; g.style.setProperty("--dur", AUTO_MS + "ms"); g.classList.add("atual"); }
    });
    agendar();
  }
  function ir(i) {
    var n = state.slides.length;
    if (!n) return;
    state.idx = (i + n) % n;
    mostrar();
  }
  function agendar() {
    clearTimeout(state.timer);
    if (state.pausado || state.segurando || state.aberta || semAuto() || document.hidden) return;
    state.timer = setTimeout(function () { ir(state.idx + 1); }, AUTO_MS);
  }
  function alternarPausa() {
    state.pausado = !state.pausado;
    state.pausaBt.innerHTML = state.pausado ? ICO_PLAY : ICO_PAUSA;
    state.pausaBt.setAttribute("aria-label", state.pausado ? "Retomar a rotação" : "Pausar a rotação");
    $("#historia").classList.toggle("parado", state.pausado || state.aberta);
    state.pausado ? clearTimeout(state.timer) : mostrar();
  }

  /* ================= detalhes ================= */
  function abrirDetalhes(it, abridor) {
    var c = cor(it.area), f = $("#folha");
    $("#folhaLista").textContent = "";
    f.style.setProperty("--a", c[0]);
    var pil = $("#folhaPilulas"); pil.textContent = "";
    pil.append(pilArea(it.area), el("span", { class: "pil", text: it.tipo }), el("span", { class: "pil sis", text: it.sistema }));
    $("#folhaTitulo").textContent = it.titulo;
    $("#folhaDetalhe").textContent = it.detalhe || "";
    var dl = $("#folhaDados"); dl.textContent = "";
    [["Sistema", it.sistema], ["Squad", it.squad], ["Janela", diaHoraTxt(it.janela)]].forEach(function (p) { if (p[1]) dl.append(el("div", {}, el("dt", { text: p[0] }), el("dd", { text: p[1] }))); });
    state.aberta = true; state.abertaEm = Date.now(); state.abridor = abridor || null;
    clearTimeout(state.timer);

  }
  function abrirFeature(f, abridor) {
    var c = cor(f.area), fo = $("#folha");
    fo.style.setProperty("--a", c[0]);
    var pil = $("#folhaPilulas"); pil.textContent = "";
    pil.append(pilSquad(f)); if (f.tipo) pil.append(el("span", { class: "pil", text: f.tipo })); if (f.sistema) pil.append(el("span", { class: "pil", text: f.sistema }));
    $("#folhaTitulo").textContent = f.titulo;
    $("#folhaDetalhe").textContent = ""; marcado($("#folhaDetalhe"), f.chamada || "");
    var ul = $("#folhaLista"); ul.textContent = "";
    (f.lista || []).forEach(function (x) { var li = el("li"); marcado(li, x); ul.append(li); });
    var dl = $("#folhaDados"); dl.textContent = "";
    [["Squad", f.squad], ["Área", nomeArea(f.area)], respDe(f) || ["", ""], ["Sistema", f.sistema], ["Onde", f.onde], ["Publicado", f.publicadoEm ? diaMes(f.publicadoEm) : ""]].forEach(function (p) { if (p[1]) dl.append(el("div", {}, el("dt", { text: p[0] }), el("dd", { text: p[1] }))); });
    state.aberta = true; state.abertaEm = Date.now(); state.abridor = abridor || null;
    clearTimeout(state.timer);
    $("#historia").classList.add("parado");
    $("#fundo").hidden = false; fo.hidden = false;
    $("#fechar").focus();
  }
  function fecharDetalhes() {
    if (!state.aberta) return;
    state.aberta = false;
    $("#fundo").hidden = true; $("#folha").hidden = true;
    $("#historia").classList.toggle("parado", state.pausado);
    if (state.abridor && state.abridor.focus) state.abridor.focus();
    agendar();
  }

  /* ================= toque, mouse e teclado ================= */
  function ligar() {
    var area = $("#slides"), x0 = 0, y0 = 0, seguro = false, t = null, ativo = false;
    area.addEventListener("pointerdown", function (ev) {
      if (ev.target.closest("button")) return;
      ativo = true; x0 = ev.clientX; y0 = ev.clientY; seguro = false;
      clearTimeout(t);
      t = setTimeout(function () { seguro = true; state.segurando = true; clearTimeout(state.timer); $("#historia").classList.add("parado"); }, 300);
    });
    function soltar(ev, cancelou) {
      if (!ativo) return;
      ativo = false; clearTimeout(t);
      var dx = ev.clientX - x0, dy = ev.clientY - y0;
      var estavaSegurando = seguro; seguro = false;
      if (state.segurando) { state.segurando = false; $("#historia").classList.toggle("parado", state.pausado || state.aberta); agendar(); }
      if (cancelou || estavaSegurando) return;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { ir(state.idx + (dx < 0 ? 1 : -1)); return; }
      if (Math.abs(dx) > 12 || Math.abs(dy) > 12) return;
      if (window.innerWidth < 900) {                       // celular: toque na borda esquerda volta, no resto avança
        var r = area.getBoundingClientRect();
        ir(state.idx + ((ev.clientX - r.left) / r.width < 0.35 ? -1 : 1));
      }                                                    // computador: clicar no slide não faz nada (setas e botões)
    }
    area.addEventListener("pointerup", function (ev) { soltar(ev, false); });
    area.addEventListener("pointercancel", function (ev) { soltar(ev, true); });
    area.addEventListener("pointerleave", function (ev) { if (ativo && ev.pointerType === "mouse") soltar(ev, true); });
    var hist = $("#historia");
    hist.addEventListener("mouseenter", function (ev) { if (window.innerWidth >= 900 && !state.aberta) { state.segurando = true; clearTimeout(state.timer); hist.classList.add("parado"); } });
    hist.addEventListener("mouseleave", function () { if (state.segurando && !ativo) { state.segurando = false; hist.classList.toggle("parado", state.pausado || state.aberta); agendar(); } });
    $("#ant").addEventListener("click", function () { ir(state.idx - 1); });
    $("#prox").addEventListener("click", function () { ir(state.idx + 1); });
    $("#fechar").addEventListener("click", fecharDetalhes);
    $("#fundo").addEventListener("click", function () { if (Date.now() - (state.abertaEm || 0) < 350) return; fecharDetalhes(); });   // ignora o clique fantasma do toque que acabou de abrir
    document.addEventListener("keydown", function (ev) {
      if (ev.key === "Escape") { fecharDetalhes(); return; }
      if (state.aberta) { if (ev.key === "Tab") { var f = [].slice.call($("#folha").querySelectorAll("button")); if (f.length === 1) { ev.preventDefault(); f[0].focus(); } } return; }
      if (ev.key === "ArrowRight") { ir(state.idx + 1); ev.preventDefault(); }
      else if (ev.key === "ArrowLeft") { ir(state.idx - 1); ev.preventDefault(); }
      else if (ev.key === " " && !ev.target.closest("button")) { alternarPausa(); ev.preventDefault(); }
    });
    document.addEventListener("visibilitychange", function () { if (document.hidden) clearTimeout(state.timer); else agendar(); });
  }

  /* ================= dados ================= */
  function receber(ed) {
    var txt = JSON.stringify(ed);
    if (txt === state.ultimoTxt) return;
    var novaEdicao = !state.ed || state.ed.id !== ed.id;
    state.ultimoTxt = txt;
    var idxAntes = state.idx;
    montar(ed);
    if (!novaEdicao) { state.idx = Math.min(idxAntes, state.slides.length - 1); mostrar(); }
    else if (state.eds.length) toast("Chegou uma edição nova.");
    state.eds[0] = ed;
  }
  function buscar() {
    var t = "?v=" + Date.now();
    Promise.all([
      fetch("atual.json" + t, { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error("atual"); return r.json(); }),
      fetch("retirados.json" + t, { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; })
    ]).then(function (res) {
      var ed = (res[0] || {}).edicao, fora = (res[1] || {}).itens || [];
      if (!ed) throw new Error("vazio");
      ed = Object.assign({}, ed, { itens: (ed.itens || []).filter(function (i) { return fora.indexOf(i.id) < 0; }) });
      var cont = Object.assign({}, ed.contagem || {});
      cont.Novo = ed.itens.filter(function (i) { return i.tipo === "Novo"; }).length;
      cont.Melhoria = ed.itens.filter(function (i) { return i.tipo === "Melhoria"; }).length;
      ed.contagem = cont;
      receber(ed);
    }).catch(function () { if (!state.ed) { var m = $("#msg"); m.hidden = false; m.textContent = "Não consegui carregar as novidades agora. Tente de novo em instantes."; } });
  }
  function iniciar() {
    ligar();
    var fonte = window.__DATA && window.__DATA.fonte;
    if (fonte === "embutido") {
      var eds = window.__DATA.edicoes || [];
      var barra = $("#previa");
      if (eds.length > 1) {
        barra.hidden = false;
        document.body.classList.add("com-previa");
        barra.append(el("span", { class: "rt", text: "Prévia:" }));
        eds.forEach(function (e, i) {
          var b = el("button", { type: "button", "aria-pressed": String(i === 0), text: e.previa || e.id });
          b.addEventListener("click", function () { [].forEach.call(barra.querySelectorAll("button"), function (x) { x.setAttribute("aria-pressed", "false"); }); b.setAttribute("aria-pressed", "true"); state.ultimoTxt = ""; state.ed = null; montar(e); });
          barra.append(b);
        });
      }
      state.eds = eds;
      if (eds.length) montar(eds[0]);
      return;
    }
    buscar();
    setInterval(buscar, 10 * 60 * 1000);
  }
  document.addEventListener("DOMContentLoaded", iniciar);
})();
